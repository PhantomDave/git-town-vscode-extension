name: Publish to VS Code Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version

      - name: Build extension
        run: npm run package

      - name: Determine if dry run
        id: dry_run
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "is_dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "is_dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Marketplace
        if: steps.dry_run.outputs.is_dry_run == 'false'
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "VSCE_TOKEN secret is required to publish" >&2
            exit 1
          fi

          npx @vscode/vsce publish --pat "$VSCE_TOKEN" --no-dependencies

      - name: Publish skipped (dry run)
        if: inputs.dry_run == 'true'
        run: echo "Dry run enabled - skipping publish to Marketplace"
