name: Auto Approve

# This workflow automatically approves PRs from bots after CI passes successfully.
# It triggers when selected CI workflows complete on a pull request and will
# also merge the PR if there are no failing or in-progress checks.
#
# For this to work with changelog PRs created by update-changelog.yml:
#   - The update-changelog workflow must use a PAT (not GITHUB_TOKEN) to create PRs
#   - This allows CI workflows to run on the created PR
#   - Once CI completes successfully, this workflow approves and merges the PR
#
# See .github/WORKFLOWS_SETUP.md for detailed setup instructions.

on:
  workflow_run:
    workflows: ["CI", "Main CI", "check"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  checks: read
  statuses: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    
    # Only run if the workflow succeeded, was triggered by a PR, and is from the same repository
    # Also verify that the PR author matches the workflow actor for security
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.pull_requests[0].draft == false &&
      (
        contains(github.event.workflow_run.actor.login, '[bot]') ||
        contains(github.event.workflow_run.pull_requests[0].user.login, '[bot]')
      )
    
    steps:
      - name: Get PR number
        id: get-pr
        run: |
          # Get the PR associated with this workflow run
          PR_ERROR_FILE=$(mktemp)
          if ! PR_DATA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" 2>"$PR_ERROR_FILE"); then
            echo "Failed to fetch workflow run data:"
            cat "$PR_ERROR_FILE"
            rm -f "$PR_ERROR_FILE"
            echo "pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          rm -f "$PR_ERROR_FILE"
          
          # Get all PRs associated with this workflow run
          PR_COUNT=$(echo "$PR_DATA" | jq -r '.pull_requests | length')
          
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No PRs associated with this workflow run"
            echo "pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ "$PR_COUNT" -gt 1 ]; then
            echo "Warning: Multiple PRs ($PR_COUNT) found for this workflow run, using the first one"
          fi
          
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.pull_requests[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "PR number is null or empty"
            echo "pr_number=" >> $GITHUB_OUTPUT
          else
            echo "Found PR #$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if PR is already approved
        id: check-approval
        if: steps.get-pr.outputs.pr_number != ''
        run: |
          # Check if this bot has already approved the PR
          REVIEWS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pulls/${{ steps.get-pr.outputs.pr_number }}/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id')
          
          if [ -n "$REVIEWS" ]; then
            echo "PR already approved by this bot"
            echo "already_approved=true" >> $GITHUB_OUTPUT
          else
            echo "already_approved=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PR targets main
        id: base-branch
        if: steps.get-pr.outputs.pr_number != ''
        run: |
          BASE=$(gh pr view ${{ steps.get-pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --json baseRefName -q .baseRefName)
          echo "PR base: $BASE"
          if [ "$BASE" = "main" ]; then
            echo "on_main=true" >> $GITHUB_OUTPUT
          else
            echo "on_main=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        if: |
          steps.get-pr.outputs.pr_number != '' && 
          steps.base-branch.outputs.on_main == 'true' &&
          steps.check-approval.outputs.already_approved == 'false'
        run: |
          gh pr review ${{ steps.get-pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --approve \
            --body "Auto-approved: All required checks passed ✅"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR head SHA
        id: head-sha
        if: steps.get-pr.outputs.pr_number != '' && steps.base-branch.outputs.on_main == 'true'
        run: |
          HEAD_SHA=$(gh pr view ${{ steps.get-pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --json headRefOid -q .headRefOid)
          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "sha=" >> $GITHUB_OUTPUT
          else
            echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT
            echo "Head SHA: $HEAD_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify checks status
        id: eval-checks
        if: steps.get-pr.outputs.pr_number != '' && steps.base-branch.outputs.on_main == 'true' && steps.head-sha.outputs.sha != ''
        run: |
          OWNER_REPO="${{ github.repository }}"
          SHA="${{ steps.head-sha.outputs.sha }}"

          # Fetch check runs for this commit
          CHECKS_JSON=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER_REPO/commits/$SHA/check-runs")
          IN_PROGRESS=$(echo "$CHECKS_JSON" | jq '[.check_runs[] | select(.status != "completed")] | length')
          FAILED=$(echo "$CHECKS_JSON" | jq '[.check_runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "stale"))] | length')

          # Fetch legacy combined status for additional coverage
          COMBINED_JSON=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER_REPO/commits/$SHA/status")
          STATE=$(echo "$COMBINED_JSON" | jq -r '.state')
          STATUSES_COUNT=$(echo "$COMBINED_JSON" | jq '.statuses | length')

          echo "Checks in progress: $IN_PROGRESS"
          echo "Checks failed: $FAILED"
          echo "Combined status: $STATE"
          echo "Legacy statuses count: $STATUSES_COUNT"

          # Allow merge if:
          # 1. No checks are in progress or failed
          # 2. Either legacy status is 'success' OR there are no legacy statuses (count=0)
          #    (when only check runs exist without legacy statuses, the API returns 'pending')
          if [ "$IN_PROGRESS" -eq 0 ] && [ "$FAILED" -eq 0 ] && { [ "$STATE" = "success" ] || [ "$STATUSES_COUNT" -eq 0 ]; }; then
            echo "merge_ok=true" >> $GITHUB_OUTPUT
          else
            echo "merge_ok=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PR has approval
        id: verify-approval
        if: steps.get-pr.outputs.pr_number != '' && steps.base-branch.outputs.on_main == 'true' && steps.eval-checks.outputs.merge_ok == 'true'
        run: |
          # Check if PR has any approvals (could be from the earlier approval step or pre-existing)
          APPROVED=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pulls/${{ steps.get-pr.outputs.pr_number }}/reviews" \
            --jq '[.[] | select(.state == "APPROVED")] | length')
          
          if [ "$APPROVED" -gt 0 ]; then
            echo "has_approval=true" >> $GITHUB_OUTPUT
          else
            echo "has_approval=false" >> $GITHUB_OUTPUT
            echo "Warning: PR does not have any approvals, skipping merge"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on Pull Request before merge
        if: steps.get-pr.outputs.pr_number != '' && steps.base-branch.outputs.on_main == 'true' && steps.eval-checks.outputs.merge_ok == 'true' && steps.verify-approval.outputs.has_approval == 'true'
        run: |
          gh pr comment ${{ steps.get-pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --body "Auto-squash-merged by workflow: all checks successful ✅"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        if: steps.get-pr.outputs.pr_number != '' && steps.base-branch.outputs.on_main == 'true' && steps.eval-checks.outputs.merge_ok == 'true' && steps.verify-approval.outputs.has_approval == 'true'
        run: |
          gh pr merge ${{ steps.get-pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
