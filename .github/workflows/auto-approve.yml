name: Auto Approve

on:
  workflow_run:
    workflows: ["CI", "Main CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    
    # Only run if the workflow succeeded, was triggered by a PR, and is from the same repository
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      (github.event.workflow_run.actor.login == 'github-actions[bot]' || 
       github.event.workflow_run.actor.login == 'dependabot[bot]')
    
    steps:
      - name: Get PR number
        id: get-pr
        run: |
          # Get the PR associated with this workflow run
          PR_DATA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}")
          
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.pull_requests[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR found for this workflow run, skipping approval"
            echo "pr_number=" >> $GITHUB_OUTPUT
          else
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if PR is already approved
        id: check-approval
        if: steps.get-pr.outputs.pr_number != ''
        run: |
          # Check if this bot has already approved the PR
          REVIEWS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pulls/${{ steps.get-pr.outputs.pr_number }}/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id')
          
          if [ -n "$REVIEWS" ]; then
            echo "PR already approved by this bot"
            echo "already_approved=true" >> $GITHUB_OUTPUT
          else
            echo "already_approved=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Pull Request
        if: |
          steps.get-pr.outputs.pr_number != '' && 
          steps.check-approval.outputs.already_approved == 'false'
        run: |
          gh pr review ${{ steps.get-pr.outputs.pr_number }} \
            --repo ${{ github.repository }} \
            --approve \
            --body "Auto-approved: All required checks passed ✅"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
