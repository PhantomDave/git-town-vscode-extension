name: Main CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.check.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in root
        id: check
        run: |
          # Determine if any files changed outside top-level dot-folders (e.g., .github, .vscode)
          # We only care about paths whose first path segment does NOT start with a dot.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD)
          printf 'Changed files:\n%s\n' "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -Ev '^\\.' -q; then
            # At least one file whose top-level segment does not start with '.'
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            # Only dot-folders/files changed
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    uses: ./.github/workflows/lint.yml

  build:
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    uses: ./.github/workflows/build.yml

  check:
    runs-on: ubuntu-latest
    needs: [changes, lint, build]
    if: always()
    steps:
      - name: Check workflow results
        run: |
          if [ "${{ needs.changes.outputs.any_changed }}" == "false" ]; then
            echo "✓ No changes detected in root directory - skipping checks"
            exit 0
          fi
          
          if [ "${{ needs.lint.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "✗ Lint or build workflow failed"
            exit 1
          fi
          
          echo "✓ All checks passed"
          exit 0
