name: Package and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v0.0.1)'
        required: true
        type: string
      publish_to_marketplace:
        description: 'Publish to VS Code Marketplace after creating release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update version in package.json
        run: |
          VERSION=${{ inputs.tag_name }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version

      - name: Package extension
        run: |
          echo "y" | npm run package-extension
          
      - name: Get extension version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Get extension filename
        id: filename
        run: |
          FILENAME=$(ls *.vsix)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.filename.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: package-and-release
    if: inputs.publish_to_marketplace
    uses: ./.github/workflows/publish-marketplace.yml
    secrets: inherit
    with:
      tag_name: ${{ inputs.tag_name }}
