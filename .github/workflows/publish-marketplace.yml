name: Publish to VS Code Marketplace

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v0.0.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
          elif [ -n "${{ inputs.tag_name }}" ]; then
            VERSION=${{ inputs.tag_name }}
          else
            echo "Error: No tag name provided" >&2
            exit 1
          fi
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          npm version $VERSION --no-git-tag-version

      - name: Build extension
        run: npm run package

      - name: Publish to Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "VSCE_TOKEN secret is required to publish" >&2
            exit 1
          fi

          npx @vscode/vsce publish --pat "$VSCE_TOKEN" --no-dependencies
